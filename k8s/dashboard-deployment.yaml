apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaling-dashboard
  namespace: autoscaling-demo
  labels:
    app: autoscaling-dashboard
    project: "357"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscaling-dashboard
  template:
    metadata:
      labels:
        app: autoscaling-dashboard
    spec:
      serviceAccountName: autoscaling-controller-sa
      initContainers:
        - name: init-policies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if [ ! -f /app/policies/scaling-policies.yaml ]; then
                echo "Initializing policies from seed ConfigMap..."
                cp /config/policies/scaling-policies.yaml /app/policies/scaling-policies.yaml
              else
                echo "Existing policies detected on persistent volume; preserving."
              fi
          volumeMounts:
            - name: policies-data
              mountPath: /app/policies
            - name: config-source
              mountPath: /config/policies
      containers:
        - name: dashboard
          image: autoscaling-framework:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "dashboard.app"]
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: TARGET_NAMESPACE
              value: "autoscaling-demo"
            - name: TARGET_DEPLOYMENT
              value: "sample-web-app"
            - name: PROMETHEUS_URL
              value: "http://prometheus-server.monitoring.svc.cluster.local:9090"
            - name: DASHBOARD_HOST
              value: "0.0.0.0"
            - name: DASHBOARD_PORT
              value: "5000"
            - name: POLICIES_PATH
              value: "/app/policies/scaling-policies.yaml"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: policies-data
              mountPath: /app/policies
      volumes:
        - name: policies-data
          persistentVolumeClaim:
            claimName: kubepilot-policies-pvc
        - name: config-source
          configMap:
            name: scaling-policies-cm
---
apiVersion: v1
kind: Service
metadata:
  name: autoscaling-dashboard
  namespace: autoscaling-demo
  labels:
    app: autoscaling-dashboard
spec:
  type: NodePort
  selector:
    app: autoscaling-dashboard
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500
