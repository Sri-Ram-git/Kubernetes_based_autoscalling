apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaling-controller
  namespace: autoscaling-demo
  labels:
    app: autoscaling-controller
    project: "357"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscaling-controller
  template:
    metadata:
      labels:
        app: autoscaling-controller
    spec:
      serviceAccountName: autoscaling-controller-sa
      initContainers:
        - name: init-policies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if [ ! -f /app/policies/scaling-policies.yaml ]; then
                echo "Initializing policies from seed ConfigMap..."
                cp /config/policies/scaling-policies.yaml /app/policies/scaling-policies.yaml
              else
                echo "Existing policies detected on persistent volume; preserving."
              fi
          volumeMounts:
            - name: policies-data
              mountPath: /app/policies
            - name: config-source
              mountPath: /config/policies
      containers:
        - name: controller
          image: autoscaling-framework:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "controller.main"]
          env:
            - name: TARGET_NAMESPACE
              value: "autoscaling-demo"
            - name: TARGET_DEPLOYMENT
              value: "sample-web-app"
            - name: PROMETHEUS_URL
              value: "http://prometheus-server.monitoring.svc.cluster.local:9090"
            - name: DRY_RUN
              value: "true"
            - name: ENABLE_LIVE_EXECUTION
              value: "false"
            - name: EVALUATION_INTERVAL_SECONDS
              value: "10"
            - name: POLICIES_PATH
              value: "/app/policies/scaling-policies.yaml"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: policies-data
              mountPath: /app/policies
      volumes:
        - name: policies-data
          persistentVolumeClaim:
            claimName: kubepilot-policies-pvc
        - name: config-source
          configMap:
            name: scaling-policies-cm
